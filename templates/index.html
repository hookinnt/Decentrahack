<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Risk Manager</title>
    <style>
        :root {
            --bg-color: #0b101e; --panel-bg: rgba(18, 26, 47, 0.9);
            --border-color: rgba(255, 255, 255, 0.08);
            --solana-green: #14F195; --solana-purple: #9945FF;
            --text-main: #f8fafc; --text-muted: #94a3b8;
        }

        body {
            background-color: var(--bg-color); color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 2rem; display: flex; justify-content: center; min-height: 100vh;
        }

        .dashboard { width: 100%; max-width: 800px; }

        .header {
            margin-bottom: 2rem; border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem; display: flex; justify-content: space-between; align-items: center;
        }
        .title { font-size: 1.25rem; font-weight: 500; letter-spacing: 0.5px; }

        .status-badge { color: var(--solana-green); font-size: 0.8rem; display: flex; align-items: center; gap: 6px; }
        .status-badge::before { content: ''; display: block; width: 8px; height: 8px; border-radius: 50%; background-color: var(--solana-green); }

        .panel {
            background-color: var(--panel-bg); border: 1px solid var(--border-color);
            border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem;
        }

        .label {
            display: block; text-transform: uppercase; font-size: 0.75rem;
            font-weight: 600; color: var(--text-muted); margin-bottom: 0.75rem; letter-spacing: 0.05em;
        }

        textarea, input, select {
            width: 100%; background: rgba(0, 0, 0, 0.2); border: 1px solid var(--border-color);
            color: var(--text-main); border-radius: 6px; padding: 1rem;
            font-family: inherit; font-size: 0.9rem; box-sizing: border-box; transition: border-color 0.2s;
        }
        textarea { resize: vertical; min-height: 100px; }
        textarea:focus, input:focus, select:focus { outline: none; border-color: var(--solana-purple); }
        option { color: black; }

        button {
            background: #1e293b; color: white; border: 1px solid var(--border-color);
            padding: 0.75rem 1.5rem; border-radius: 6px; font-weight: 500;
            cursor: pointer; transition: all 0.2s; margin-top: 1rem; font-size: 0.9rem; width: 100%;
        }
        button:hover { background: #334155; border-color: #475569; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .results { display: none; }
        .risk-meter { height: 6px; background: rgba(255,255,255,0.05); border-radius: 3px; margin: 1.5rem 0; overflow: hidden; }
        .risk-fill { height: 100%; width: 0%; border-radius: 3px; transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); }

        .tx-log {
            font-family: Consolas, 'Liberation Mono', Menlo, monospace;
            background: rgba(0,0,0,0.5); padding: 1rem; border-radius: 6px;
            font-size: 0.8rem; color: #94a3b8; white-space: pre-wrap; border: 1px solid rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <header class="header">
            <div class="title">Oracle Risk Manager (Solana)</div>
            <div class="status-badge">RPC Connected</div>
        </header>

        <div class="panel">
            <label class="label">Поток данных (Ввод оракула)</label>
            <textarea id="newsInput" placeholder="Опишите угрозу, аномалию или новость на Solana..."></textarea>
            
            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <div style="flex: 1;">
                    <label class="label">TVL Протокола ($)</label>
                    <input type="text" id="tvlInput" placeholder="Например: 50M">
                </div>
                <div style="flex: 1;">
                    <label class="label">Волатильность (Рынок)</label>
                    <select id="volatilityInput">
                        <option value="Low">Низкая (Стабильно)</option>
                        <option value="Medium" selected>Средняя (Норма)</option>
                        <option value="High">Высокая (Паника)</option>
                    </select>
                </div>
            </div>

            <button id="analyzeBtn" onclick="analyzeText()">Мульти-Анализ ИИ</button>
        </div>

        <div class="panel results" id="resultsPanel">
            <label class="label">Метрика Безопасности</label>
            <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                <div style="font-size: 2.5rem; font-weight: 300;" id="riskScore">0<span style="font-size:1rem; color:var(--text-muted)">/100</span></div>
                <div id="actionStatus" style="font-weight: 500; font-size: 0.9rem;">...</div>
            </div>
            
            <div class="risk-meter"><div class="risk-fill" id="riskFill"></div></div>
            <p id="reasonText" style="color: #cbd5e1; font-size: 0.9rem; line-height: 1.6;"></p>

            <div id="txLogContainer" style="display: none; margin-top: 2rem;">
                <label class="label">Выполнение Транзакции (Anchor CPI)</label>
                <div class="tx-log" id="txLog"></div>
            </div>
        </div>
    </div>

    <script>
        async function analyzeText() {
            const input = document.getElementById('newsInput').value;
            const tvl = document.getElementById('tvlInput').value || 'Неизвестно';
            const volatility = document.getElementById('volatilityInput').value;
            const btn = document.getElementById('analyzeBtn');
            const resultsPanel = document.getElementById('resultsPanel');
            
            if (!input.trim()) return;

            btn.disabled = true;
            btn.innerText = "Идет сборка и анализ данных...";
            resultsPanel.style.display = "none";

            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ news: input, tvl: tvl, volatility: volatility })
                });
                
                if (!response.ok) throw new Error("Network response was not ok");
                const data = await response.json();
                if (data.error) throw new Error(data.error);

                document.getElementById('riskScore').innerHTML = `${data.risk_score}<span style="font-size:1rem; color:var(--text-muted)">/100</span>`;
                document.getElementById('reasonText').innerText = data.reason;
                
                const riskFill = document.getElementById('riskFill');
                riskFill.style.width = `${data.risk_score}%`;

                const actionStatus = document.getElementById('actionStatus');
                const txLogContainer = document.getElementById('txLogContainer');
                const txLog = document.getElementById('txLog');

                if (data.risk_score >= 80) {
                    riskFill.style.background = '#ef4444';
                    actionStatus.innerText = 'КРИТИЧЕСКАЯ УГРОЗА';
                    actionStatus.style.color = '#ef4444';
                    txLogContainer.style.display = 'block';
                    txLog.innerHTML = `[PROGRAM] solana_risk_manager (Fg6PaFpoGXkYsidMpWTK6W2BeZ7FEfcYkg476zPFsLnS)\n[INSTRUCTION] emergency_pause\n[SIGNERS] Oracle AI Key\n[STATUS] Success. Treasury is now frozen.`;
                } else {
                    riskFill.style.background = 'var(--solana-green)';
                    actionStatus.innerText = 'ШТАТНЫЙ РЕЖИМ';
                    actionStatus.style.color = 'var(--solana-green)';
                    txLogContainer.style.display = 'none';
                }
                resultsPanel.style.display = "block";
            } catch (err) {
                alert("Ошибка соединения с модулем логики.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Мульти-Анализ ИИ";
            }
        }
    </script>
</body>
</html>
