<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOLANA AI RISK ORGANISM</title>
    <meta name="description" content="Autonomous AI Security Layer for Solana Treasury. Gov-Grade.">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root {
            --bg:           #060606;
            --surface:      #121212;
            --surface-alt:  #1a1a1a;
            --border:       rgba(255,255,255,0.06);
            --sol-green:    #00ffa3;
            --sol-purple:   #8a2be2;
            --sol-red:      #ff3131;
            --sol-orange:   #ff9900;
            --sol-blue:     #00c2ff;
            --text-main:    #ffffff;
            --text-muted:   #777777;
            --transition:   all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ── Canvas Background ──────────────────────────────────── */
        #neural-mesh {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            opacity: 0.15;
            pointer-events: none;
        }

        /* ── Responsive Layout ──────────────────────────────────── */
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        @media (min-width: 1024px) {
            .container {
                grid-template-columns: 400px 1fr;
                align-items: start;
            }
            .sidebar { position: sticky; top: 24px; }
        }

        /* ── Common Card Style ──────────────────────────────────── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(20px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* ── Header Area ────────────────────────────────────────── */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 24px 0;
        }
        .organism-id { font-weight: 700; color: var(--sol-purple); letter-spacing: 0.2em; font-size: 14px; }
        .system-status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--sol-green); }
        .pulse { width: 8px; height: 8px; background: var(--sol-green); border-radius: 50%; box-shadow: 0 0 10px var(--sol-green); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 0.3; transform: scale(1); } 50% { opacity: 1; transform: scale(1.2); } 100% { opacity: 0.3; transform: scale(1); } }

        /* ── Risk Gauge Component ───────────────────────────────── */
        .gauge-container {
            position: relative;
            width: 240px;
            height: 140px;
            margin: 0 auto 16px;
        }
        .gauge-svg { width: 100%; height: 100%; }
        .gauge-bg { fill: none; stroke: var(--surface-alt); stroke-width: 12; stroke-linecap: round; }
        .gauge-fill { 
            fill: none; 
            stroke-width: 12; 
            stroke-linecap: round; 
            stroke-dasharray: 283; 
            stroke-dashoffset: 283; 
            transition: var(--transition);
            filter: drop-shadow(0 0 8px var(--sol-purple));
        }
        .gauge-value {
            position: absolute;
            bottom: 5px; left: 50%;
            transform: translateX(-50%);
            font-size: 44px; font-weight: 700;
        }
        .gauge-value span { font-size: 16px; color: var(--text-muted); margin-left: 2px; }

        /* ── State Indicators ───────────────────────────────────── */
        .status-badge {
            display: inline-flex;
            padding: 6px 12px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 24px;
        }
        .status-safe { background: rgba(0, 255, 163, 0.1); color: var(--sol-green); }
        .status-danger { background: rgba(255, 49, 49, 0.1); color: var(--sol-red); animation: shake 0.5s ease; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

        /* ── Authority Panel ────────────────────────────────────── */
        .auth-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; }
        .pubkey { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--sol-purple); word-break: break-all; margin-bottom: 20px; }
        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 24px; }
        .metric-card { background: var(--surface-alt); padding: 16px; border-radius: 16px; }
        .metric-title { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
        .metric-value { font-size: 18px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }

        /* ── Audit Table ────────────────────────────────────────── */
        .audit-trail { margin-top: 32px; }
        .table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .table-header h2 { font-size: 14px; color: var(--text-muted); text-transform: uppercase; }
        .history-list { display: flex; flex-direction: column; gap: 12px; }
        .history-item { 
            background: var(--surface); 
            border: 1px solid var(--border); 
            border-radius: 16px; padding: 16px; 
            display: flex; justify-content: space-between; align-items: flex-start;
            transition: var(--transition);
        }
        .history-item:hover { transform: translateY(-2px); border-color: rgba(138, 43, 226, 0.3); }
        .h-info { flex: 1; margin-right: 16px; }
        .h-reason { font-size: 13px; margin-top: 4px; line-height: 1.4; color: var(--text-muted); }
        .h-tx { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--sol-purple); text-decoration: none; display: block; margin-top: 8px; }
        .h-score { font-size: 18px; font-weight: 700; }

        /* ── Mobile Logic ────────────────────────────────────────── */
        .actions { display: grid; gap: 12px; margin-top: 24px; }
        .btn {
            border: none; border-radius: 18px; padding: 18px;
            font-family: inherit; font-weight: 700; font-size: 14px;
            text-transform: uppercase; letter-spacing: 0.1em;
            cursor: pointer; transition: var(--transition);
            display: flex; align-items: center; justify-content: center; gap: 8px;
            touch-action: manipulation;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
        .btn-primary { background: var(--text-main); color: var(--bg); }
        .btn-secondary { background: var(--surface-alt); color: var(--text-main); border: 1px solid var(--border); }
        .btn:active { transform: scale(0.96); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ── Toast Notifications ────────────────────────────────── */
        #notification-area { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); z-index: 1000; width: calc(100% - 48px); max-width: 400px; display: flex; flex-direction: column; gap: 8px; }
        .toast { background: rgba(0,0,0,0.9); border: 1px solid var(--sol-purple); padding: 16px; border-radius: 20px; backdrop-filter: blur(10px); display: flex; align-items: center; gap: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); animation: toastIn 0.5s cubic-bezier(0.19, 1, 0.22, 1) forwards; }
        @keyframes toastIn { from { opacity: 0; transform: translate(-50%, -40px); } to { opacity: 1; transform: translate(0, 0); } }

        .hidden { display: none; }
    </style>
</head>
<body>

    <canvas id="neural-mesh"></canvas>

    <div id="notification-area"></div>

    <div class="header">
        <div class="organism-id">SOLANA AI Risk Organism v1.5</div>
        <div class="system-status">
            <div class="pulse"></div>
            LIVE SYNC
        </div>
    </div>

    <div class="container">
        <!-- Sidebar: Operational Focus -->
        <div class="sidebar">
            <div class="card" style="text-align:center;">
                <div id="status-badge" class="status-badge status-safe">ACTIVE SYSTEM</div>
                
                <div class="gauge-container">
                    <svg class="gauge-svg" viewBox="0 0 100 60">
                        <path class="gauge-bg" d="M 10 50 A 40 40 0 1 1 90 50" />
                        <path id="gauge-fill" class="gauge-fill" d="M 10 50 A 40 40 0 1 1 90 50" style="stroke: var(--sol-green);" />
                    </svg>
                    <div class="gauge-value" id="risk-score">0<span>%</span></div>
                </div>

                <div id="ai-verdict" style="font-size: 14px; margin-bottom: 24px; color: var(--text-muted); min-height: 40px;">
                    Инициализация нейронного щита...
                </div>

                <div class="metrics-grid">
                    <div class="metric-card">
                        <div class="metric-title">SOL / USD</div>
                        <div class="metric-value" id="sol-price">$0.00</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-title">TVL LOCKET</div>
                        <div class="metric-value text-muted" id="sol-tvl">$1.4B</div>
                    </div>
                </div>

                <div class="actions">
                    <button class="btn btn-primary" onclick="manualCheck()" id="analyze-btn">ВЕРДИКТ ИИ</button>
                    <button class="btn btn-secondary" onclick="manageTreasury('resume')" id="resume-btn">РАЗБЛОКИРОВАТЬ</button>
                    <button class="btn btn-secondary" onclick="manageTreasury('initialize')" id="init-btn">ИНИЦИАЛИЗАЦИЯ PDA</button>
                </div>
            </div>

            <div class="card" style="margin-top:24px;">
                <div class="auth-label">SMART CONTRACT AUTHORITY</div>
                <div class="pubkey" id="agent-pk">...</div>
                
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div class="auth-label">PAUSE COUNT</div>
                    <div style="font-family:'JetBrains Mono'; font-weight:700;" id="pause-count">0</div>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
                    <div class="auth-label">DARS THRESHOLD</div>
                    <div style="font-family:'JetBrains Mono'; font-weight:700; color:var(--sol-orange);" id="active-threshold">80%</div>
                </div>
            </div>
        </div>

        <!-- Main Content: Audit Trail -->
        <div class="main-content">
            <div class="card" style="min-height: 500px;">
                <div class="table-header">
                    <h2>ЖУРНАЛ АВТОНОМНОГО АУДИТА</h2>
                    <div id="last-sync" style="font-size: 11px; color: var(--text-muted); font-family: 'JetBrains Mono';">SYCNED: 00:00:00</div>
                </div>
                
                <div id="history-list" class="history-list">
                    <!-- Dynamic -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let lastId = null;

        // Initialize Neural Mesh Background
        function initMesh() {
            const canvas = document.getElementById('neural-mesh');
            const ctx = canvas.getContext('2d');
            let w, h, particles = [];

            const resize = () => { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; };
            window.addEventListener('resize', resize);
            resize();

            for(let i=0; i<40; i++) particles.push({ x: Math.random()*w, y: Math.random()*h, vx: (Math.random()-0.5)*0.5, vy: (Math.random()-0.5)*0.5 });

            function draw() {
                ctx.clearRect(0,0,w,h);
                ctx.fillStyle = '#8a2be2';
                ctx.strokeStyle = 'rgba(138, 43, 226, 0.1)';
                particles.forEach(p => {
                    p.x += p.vx; p.y += p.vy;
                    if(p.x < 0 || p.x > w) p.vx *= -1; if(p.y < 0 || p.y > h) p.vy *= -1;
                    ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2); ctx.fill();
                });
                for(let i=0; i<particles.length; i++) {
                    for(let j=i+1; j<particles.length; j++) {
                        let d = Math.hypot(particles[i].x-particles[j].x, particles[i].y-particles[j].y);
                        if(d < 150) { ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.stroke(); }
                    }
                }
                requestAnimationFrame(draw);
            }
            draw();
        }
        initMesh();

        // Socket.IO State Handler
        socket.on('state_update', (state) => {
            console.log("State Update:", state);
            updateUI(state);
        });

        function updateUI(state) {
            const { status, history, notifications } = state;
            const onChain = status.on_chain;

            // Basic Stats
            document.getElementById('sol-price').innerText = `$${status.price}`;
            document.getElementById('sol-tvl').innerText = `$${status.tvl}`;
            document.getElementById('last-sync').innerText = `SYNCED: ${status.last_check}`;
            document.getElementById('agent-pk').innerText = onChain.agent_pubkey;
            document.getElementById('pause-count').innerText = onChain.pause_count;
            document.getElementById('active-threshold').innerText = `${onChain.risk_threshold}%`;

            // Gauge Update
            const risk = history.length > 0 ? history[0].risk_score : 0;
            const verdict = history.length > 0 ? history[0].reason : "Система в режиме ожидания...";
            
            document.getElementById('risk-score').innerHTML = `${risk}<span>%</span>`;
            document.getElementById('ai-verdict').innerText = verdict;

            const dashoffset = 283 - (283 * (risk / 100));
            const fill = document.getElementById('gauge-fill');
            fill.style.strokeDashoffset = dashoffset;
            fill.style.stroke = risk < 40 ? 'var(--sol-green)' : (risk < 80 ? 'var(--sol-orange)' : 'var(--sol-red)');

            // On-Chain Status Badge
            const badge = document.getElementById('status-badge');
            if (onChain.is_paused) {
                badge.innerText = "TREASURY PAUSED";
                badge.className = "status-badge status-danger";
                document.getElementById('resume-btn').classList.remove('hidden');
            } else {
                badge.innerText = "SYSTEM ACTIVE";
                badge.className = "status-badge status-safe";
                document.getElementById('resume-btn').classList.add('hidden');
            }

            // Init Button Logic
            if (onChain.account_missing) {
                document.getElementById('init-btn').classList.remove('hidden');
            } else {
                document.getElementById('init-btn').classList.add('hidden');
            }

            // Audit Trail
            const list = document.getElementById('history-list');
            list.innerHTML = history.map(h => `
                <div class="history-item">
                    <div class="h-info">
                        <div style="display:flex; justify-content:space-between;">
                            <span class="auth-label">${h.timestamp}</span>
                            <div class="h-score" style="color: ${h.risk_score < 40 ? 'var(--sol-green)' : (h.risk_score < 80 ? 'var(--sol-orange)' : 'var(--sol-red)')}">${h.risk_score}%</div>
                        </div>
                        <div class="h-reason">${h.reason}</div>
                        ${h.tx_hash ? `<a href="https://solscan.io/tx/${h.tx_hash}?cluster=devnet" target="_blank" class="h-tx">TX: ${h.tx_hash.slice(0,16)}...</a>` : ''}
                    </div>
                </div>
            `).join('');

            // Notifications
            if (notifications.length > 0 && notifications[0].id !== lastId) {
                showToast(notifications[0].title, notifications[0].message);
                lastId = notifications[0].id;
            }
        }

        function showToast(title, message) {
            const area = document.getElementById('notification-area');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `
                <div style="font-size: 24px;">🛡️</div>
                <div>
                    <div style="font-weight: 700; font-size: 14px;">${title}</div>
                    <div style="font-size: 12px; color: var(--text-muted);">${message}</div>
                </div>
            `;
            area.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 500); }, 5000);
        }

        async function manualCheck() {
            const btn = document.getElementById('analyze-btn');
            btn.disabled = true; btn.innerText = 'АНАЛИЗ...';
            try {
                await fetch('/api/analyze', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ news: 'Экстренный министерский запрос аудита состояния казначейства.', tvl: '1.4B', volatility: 'Medium' })
                });
            } catch(e) { console.error(e); }
            finally { btn.disabled = false; btn.innerText = 'ВЕРДИКТ ИИ'; }
        }

        async function manageTreasury(action) {
            const btn = event.target;
            btn.disabled = true;
            try {
                const res = await fetch(`/api/${action}`, { method: 'POST' });
                const data = await res.json();
                if (data.signature) {
                    showToast('СИСТЕМА ОБНОВЛЕНА', `Транзакция подтверждена: ${data.signature.slice(0,10)}...`);
                }
            } catch(e) { console.error(e); }
            finally { btn.disabled = false; }
        }
    </script>
</body>
</html>
